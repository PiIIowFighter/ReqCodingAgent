<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本地股票看板</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero"><p class="eyebrow">LOCAL MARKET BOARD</p><h1>股票看板</h1><p class="muted">浏览本地模拟数据</p></header>
    <section class="panel" aria-labelledby="list-title">
      <div class="panel-heading"><h2 id="list-title">股票列表</h2><span id="result-count" class="muted"></span></div>
      <div id="stock-list" class="stock-list" aria-live="polite"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
