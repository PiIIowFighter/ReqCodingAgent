[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reqcodingagent-evalsys"
version = "0.1.0"
description = "Requirement-engineering-driven Coding Agent and reproducible evaluation system"
requires-python = ">=3.11,<3.12"
dependencies = [
  "anthropic>=0.105,<0.106",
  "jsonschema[format]>=4.23,<5",
  "openai>=1.109,<2",
  "pyarrow>=17,<20",
]

[project.scripts]
evalsys = "evalsys.cli:main"
reqagent = "reqagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
