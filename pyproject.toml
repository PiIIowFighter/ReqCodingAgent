[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "reqcodingagent-evalsys"
version = "0.1.0"
description = "Frozen reproducible SWE-bench evaluation environment"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "pyarrow>=17,<20",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[project.scripts]
evalsys = "evalsys.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: requires external benchmark data or Docker",
]
